<svg width="420" height="480" viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Illustration of a developer working at a desk</title>
<desc>Detailed flat-style illustration of a person sitting at a desk with dual monitors showing code, a plant, and a coffee cup, in navy and light-blue tones.</desc>

<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#132a4d"/>
    <stop offset="100%" stop-color="#0a1526"/>
  </linearGradient>
  <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b3a63"/>
    <stop offset="100%" stop-color="#0f2544"/>
  </linearGradient>
</defs>

<rect x="10" y="10" width="400" height="460" rx="24" fill="url(#bgGrad)"/>

<!-- floor shadow -->
<ellipse cx="210" cy="430" rx="150" ry="16" fill="#050b16"/>

<!-- desk -->
<rect x="70" y="330" width="280" height="16" rx="5" fill="#274a78"/>
<rect x="90" y="346" width="14" height="66" fill="#1e3a5f"/>
<rect x="316" y="346" width="14" height="66" fill="#1e3a5f"/>

<!-- plant on desk -->
<rect x="330" y="300" width="26" height="30" rx="4" fill="#274a78"/>
<path d="M343 300 C333 280 333 260 343 245 C353 260 353 280 343 300 Z" fill="#4fae8a"/>
<path d="M343 300 C356 285 366 270 372 252 C366 275 358 292 343 300 Z" fill="#3f8f70"/>
<path d="M343 300 C330 285 320 270 314 252 C320 275 328 292 343 300 Z" fill="#5cc79b"/>

<!-- coffee cup -->
<rect x="95" y="312" width="20" height="18" rx="3" fill="#93c5fd"/>
<path d="M115 316 q10 0 10 7 q0 7 -10 7" stroke="#93c5fd" stroke-width="3" fill="none"/>
<path d="M100 305 q3 -8 0 -14" stroke="#5b83ad" stroke-width="2" fill="none" opacity="0.6"/>
<path d="M108 305 q3 -8 0 -14" stroke="#5b83ad" stroke-width="2" fill="none" opacity="0.6"/>

<!-- monitor stand -->
<rect x="196" y="272" width="28" height="14" fill="#1e3a5f"/>
<rect x="184" y="286" width="52" height="8" rx="3" fill="#1e3a5f"/>

<!-- main monitor -->
<rect x="140" y="150" width="140" height="122" rx="8" fill="#12233f" stroke="#93c5fd" stroke-width="2"/>
<rect x="152" y="162" width="116" height="98" rx="3" fill="url(#screenGrad)"/>
<rect x="164" y="174" width="52" height="7" rx="3" fill="#93c5fd"/>
<rect x="164" y="188" width="80" height="7" rx="3" fill="#4a7bb0"/>
<rect x="164" y="202" width="66" height="7" rx="3" fill="#93c5fd"/>
<rect x="164" y="216" width="40" height="7" rx="3" fill="#4a7bb0"/>
<rect x="164" y="230" width="70" height="7" rx="3" fill="#93c5fd"/>
<rect x="164" y="244" width="30" height="7" rx="3" fill="#4a7bb0"/>

<!-- side monitor -->
<rect x="290" y="185" width="70" height="60" rx="6" fill="#12233f" stroke="#93c5fd" stroke-width="1.5" transform="rotate(6 325 215)"/>
<rect x="298" y="194" width="54" height="42" rx="2" fill="url(#screenGrad)" transform="rotate(6 325 215)"/>

<!-- keyboard -->
<rect x="150" y="300" width="120" height="16" rx="4" fill="#12233f"/>
<rect x="158" y="304" width="8" height="6" rx="1" fill="#3b6ea5"/>
<rect x="170" y="304" width="8" height="6" rx="1" fill="#3b6ea5"/>
<rect x="182" y="304" width="8" height="6" rx="1" fill="#3b6ea5"/>
<rect x="194" y="304" width="40" height="6" rx="1" fill="#3b6ea5"/>
<rect x="238" y="304" width="8" height="6" rx="1" fill="#3b6ea5"/>
<rect x="250" y="304" width="8" height="6" rx="1" fill="#3b6ea5"/>

<!-- chair -->
<path d="M175 412 L175 380 Q175 362 195 362 L245 362 Q265 362 265 380 L265 412 Z" fill="#1e3a5f"/>
<rect x="200" y="374" width="40" height="52" rx="6" fill="#93c5fd"/>
<rect x="160" y="410" width="120" height="10" rx="4" fill="#12233f"/>
<circle cx="175" cy="425" r="5" fill="#3b6ea5"/>
<circle cx="265" cy="425" r="5" fill="#3b6ea5"/>

<!-- person -->
<circle cx="220" cy="248" r="24" fill="#f2c29c"/>
<path d="M196 240 Q196 216 220 216 Q244 216 244 240 L244 236 Q220 228 196 236 Z" fill="#2b2b2b"/>
<path d="M196 240 Q192 254 200 262" stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M244 240 Q248 254 240 262" stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round"/>

<path d="M186 300 Q186 272 220 272 Q254 272 254 300 L254 314 L186 314 Z" fill="#93c5fd"/>
<path d="M196 280 L186 302 L200 306 Z" fill="#7bb3ee"/>
<path d="M244 280 L254 302 L240 306 Z" fill="#7bb3ee"/>

<!-- floating accents -->
<text x="60" y="120" font-family="monospace" font-size="20" fill="#93c5fd" opacity="0.55">&lt;/&gt;</text>
<text x="335" y="110" font-family="monospace" font-size="16" fill="#93c5fd" opacity="0.45">{ }</text>
<circle cx="90" cy="160" r="4" fill="#93c5fd" opacity="0.5"/>
<circle cx="360" cy="150" r="3" fill="#93c5fd" opacity="0.4"/>
<circle cx="55" cy="230" r="3" fill="#93c5fd" opacity="0.4"/>
</svg>
