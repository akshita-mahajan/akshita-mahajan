  <!-- ===================== CODE SNIPPET (plain text, no box) ===================== -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="19" font-weight="500">
    <text x="50" y="70"><tspan fill="#ff9d5c">const</tspan><tspan fill="#e6edf3"> akshitaMahajan</tspan><tspan fill="#7d93b2"> = {</tspan></text>
    <text x="50" y="102"><tspan fill="#79c0ff">  title</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">"CS Student",</tspan></text>
    <text x="50" y="134"><tspan fill="#79c0ff">  stack</tspan><tspan fill="#7d93b2">: {</tspan></text>
    <text x="50" y="166"><tspan fill="#79c0ff">    languages</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["Java", "C", "C++", "JavaScript"],</tspan></text>
    <text x="50" y="198"><tspan fill="#79c0ff">    web</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["HTML", "CSS", "MERN Stack"],</tspan></text>
    <text x="50" y="230"><tspan fill="#79c0ff">    databases</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["MongoDB", "PostgreSQL", "MySQL"],</tspan></text>
    <text x="50" y="262"><tspan fill="#79c0ff">    deployment</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["Vercel"],</tspan></text>
    <text x="50" y="294"><tspan fill="#79c0ff">    tools</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["GitHub", "Figma", "Canva"],</tspan></text>
    <text x="50" y="326"><tspan fill="#7d93b2">  },</tspan></text>
    <text x="50" y="358"><tspan fill="#79c0ff">  launchedProjects</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["BreastCare-AI", "HR Enterprise"],</tspan></text>
    <text x="50" y="390"><tspan fill="#79c0ff">  currentlyLearning</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">["Full Stack Development",</tspan></text>
    <text x="50" y="416"><tspan fill="#a5d6ff">    "Data Structures &amp; Algorithms"],</tspan></text>
    <text x="50" y="448"><tspan fill="#79c0ff">  status</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">"Digitalizing healthcare &amp; enterprise</tspan></text>
    <text x="50" y="474"><tspan fill="#a5d6ff">    workflows, one repo at a time",</tspan></text>
    <text x="50" y="506"><tspan fill="#79c0ff">  openTo</tspan><tspan fill="#7d93b2">: </tspan><tspan fill="#a5d6ff">"Internship opportunities",</tspan></text>
    <text x="50" y="538"><tspan fill="#7d93b2">};</tspan></text>
  </g>

